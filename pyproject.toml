[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripwire-protocol"
version = "0.2.0"
description = "TripWire: policy-enforced gateway, firewall and adversary simulation for multi-agent communication"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tripwire = "tripwire.__main__:main"

[tool.setuptools.packages.find]
include = ["tripwire*"]

[tool.setuptools.package-data]
tripwire = ["dashboard.html"]
