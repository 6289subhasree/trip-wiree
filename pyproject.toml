[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripwire-protocol"
version = "0.3.0"
description = "TripWire: runtime containment for AI agents - signed task manifests, a capability tool gateway and adversary simulation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tripwire = "tripwire.__main__:main"

[tool.setuptools.packages.find]
include = ["tripwire*"]

[tool.setuptools.package-data]
tripwire = ["dashboard.html"]
