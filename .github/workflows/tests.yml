name: TripWire tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit, security and API tests
        run: python -m unittest discover -t . -s tests -v
      - name: Scripted demo smoke test
        run: python -m tripwire demo
      - name: Attack matrix smoke test
        run: python -m tripwire attack-demo
      - name: Invoice (PRD) demo smoke test
        run: python -m tripwire invoice-demo
